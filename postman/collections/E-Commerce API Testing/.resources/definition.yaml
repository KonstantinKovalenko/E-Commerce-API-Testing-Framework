$kind: collection
name: E-Commerce API Testing
scripts:
  - type: http:beforeRequest
    code: "pm.globals.set(\"utils\", `\r

      \r

      \    function validateStatusCode(expectedCode) {\r

      \        pm.test(\\`Status code is \\${expectedCode}\\`, () => {\r

      \            pm.response.to.have.status(expectedCode);\r

      \        });\r

      \    }\r

      \r

      \    function validateJsonValue(key, actualValue, expectedValue) {\r

      \        pm.test(\\`\\${key} validation\\`, () => {\r

      \            pm.expect(actualValue).to.eql(expectedValue);\r

      \        });\r

      \    }\r

      `);\r

      \r

      if(!pm.environment.get(\"userName\")){\r

      \    const currentDate = Date.now();\r

      \    const random = Math.floor(Math.random() * 100);\r

      \r

      \    pm.environment.set(\"userName\", `user_${currentDate}`);\r

      \    pm.environment.set(\"userEmail\", `email_${currentDate}@qa.com`)\r

      \    pm.environment.set(\"userPassword\", `Qa!${currentDate}${random}`)\r

      \    pm.environment.set(\"userTitle\", `title_${currentDate}`);\r

      \    pm.environment.set(\"userBDay\", \"20\");\r

      \    pm.environment.set(\"userBMonth\", \"10\");\r

      \    pm.environment.set(\"userBYear\", \"2000\");\r

      \    pm.environment.set(\"userFirst\", `first_${currentDate}`);\r

      \    pm.environment.set(\"userLast\", `last_${currentDate}`);\r

      \    pm.environment.set(\"userCompany\", `company_${currentDate}`);\r

      \    pm.environment.set(\"userAdd1\", `address1_${currentDate}`);\r

      \    pm.environment.set(\"userAdd2\", `address2_${currentDate}`);\r

      \    pm.environment.set(\"userCountry\", `country_${currentDate}`);\r

      \    pm.environment.set(\"userState\", `state_${currentDate}`);\r

      \    pm.environment.set(\"userCity\", `city_${currentDate}`);\r

      \    pm.environment.set(\"userZip\", `zip_${currentDate}`);\r

      \    pm.environment.set(\"userMobile\", `mob_${currentDate}`);\r

      \r

      \    pm.environment.set(\"userInvalidEmail\", `${currentDate}`)\r

      \r

      \    console.log(\"If worked\")\r

      }else{console.log(\"Else worked\")}"
