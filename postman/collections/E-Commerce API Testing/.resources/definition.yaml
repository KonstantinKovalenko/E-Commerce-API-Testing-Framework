$kind: collection
name: E-Commerce API Testing
scripts:
  - type: http:beforeRequest
    code: "pm.globals.set(\"utils\", `\r

      \r

      \    function validateStatusCode(expectedCode) {\r

      \        pm.test(\\`Status code is \\${expectedCode}\\`, () => {\r

      \            pm.response.to.have.status(expectedCode);\r

      \        });\r

      \    }\r

      \r

      \    function validateJsonValue(key, actualValue, expectedValue) {\r

      \        pm.test(\\`\\${key} validation\\`, () => {\r

      \            pm.expect(actualValue).to.eql(expectedValue);\r

      \        });\r

      \    }\r

      `);\r

      \r

      if(!pm.environment.get(\"userName\")){\r

      \    const currentDate = Date.now();\r

      \    const random = Math.floor(Math.random() * 100);\r

      \r

      \    pm.environment.set(\"currentRandom\", currentDate);\r

      \    pm.environment.set(\"userName\", `user_${currentDate}`);\r

      \    pm.environment.set(\"userEmail\", `email_${currentDate}@qa.com`)\r

      \    pm.environment.set(\"userPassword\", `Qa!${currentDate}${random}`)\r

      \r

      \    console.log(\"If worked\")\r

      }else{console.log(\"Else worked\")}"
