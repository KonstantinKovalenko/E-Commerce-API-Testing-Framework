$kind: http-request
name: "200: Verify Login with valid credentials"
url: "{{baseUrl}}/verifyLogin"
method: POST
body:
  type: urlencoded
  content:
    email: "{{userEmail}}"
    password: "{{userPassword}}"
scripts:
  - type: afterResponse
    code: "eval(pm.globals.get(\"utils\"));\r

      const jsonResponse = pm.response.json()\r

      \r

      validateStatusCode(200);\r

      validateJsonValue(Object.keys(jsonResponse)[0], jsonResponse.responseCode, 200)\r

      validateJsonValue(Object.keys(jsonResponse)[1], jsonResponse.message, \"User exists!\")"
    language: text/javascript
order: 1778670409620
