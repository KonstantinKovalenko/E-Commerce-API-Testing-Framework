$kind: http-request
name: "200: Verify Login with valid credentials"
url: "{{baseUrl}}/verifyLogin"
method: POST
body:
  type: urlencoded
  content:
    email: "{{userEmail}}"
    password: "{{userPassword}}"
scripts:
  - type: afterResponse
    code: "const jsonResponse = pm.response.json()\r

      \r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"responseCode validation\", function () {\r

      \    pm.expect(jsonResponse.responseCode).to.eql(200);\r

      });\r

      \r

      pm.test(\"message validation\", function () {\r

      \    pm.expect(jsonResponse.message).to.eql(\"User exists!\");\r

      });"
    language: text/javascript
order: 1778670409620
