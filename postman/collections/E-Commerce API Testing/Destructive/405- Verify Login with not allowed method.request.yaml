$kind: http-request
name: "405: Verify Login with not allowed method"
url: "{{cfg_baseUrl}}/verifyLogin"
method: "{{RUNTIME_METHOD}}"
body:
  type: urlencoded
  content:
    - key: email
      value: "{{runtime_userEmail}}"
      disabled: true
    - key: password
      value: "{{runtime_userPassword}}"
      disabled: true
scripts:
  - type: afterResponse
    code: "const methods = [\"GET\", \"PUT\", \"PATCH\", \"DELETE\"];\r

      let currentIndex = Number(pm.environment.get(\"runtime_methodIndex\") || 0);\r

      currentIndex++;\r

      \r

      if (currentIndex < methods.length) {\r

      \    pm.environment.set(\"runtime_methodIndex\", currentIndex);\r

      \    pm.execution.setNextRequest(pm.info.requestName);\r

      } else {\r

      \    pm.environment.unset(\"runtime_methodIndex\");\r

      \    pm.execution.setNextRequest(null);\r

      }"
    language: text/javascript
  - type: beforeRequest
    code: "const methods = [\"GET\", \"PUT\", \"PATCH\", \"DELETE\"];\r

      \r

      let currentIndex = Number(pm.environment.get(\"runtime_methodIndex\") || 0);\r

      pm.environment.set(\"RUNTIME_METHOD\", methods[currentIndex]);\r

      \r

      pm.environment.set(\"runtime_expectedStatusCode\",200);\r

      pm.environment.set(\"runtime_expectedResponseCode\",405);\r

      pm.environment.set(\"runtime_expectedMessageKeyword\", \"not supported\");"
    language: text/javascript
order: 3632744608255950
