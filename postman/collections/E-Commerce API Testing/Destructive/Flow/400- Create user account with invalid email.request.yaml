$kind: http-request
name: "400: Create user account with invalid email"
url: "{{cfg_baseUrl}}/createAccount"
method: POST
body:
  type: urlencoded
  content:
    name: "{{runtime_userName}}"
    email: "{{runtime_userInvalidEmail}}"
    password: "{{runtime_userPassword}}"
    title: "{{runtime_userTitle}}"
    birth_date: "{{runtime_userBDay}}"
    birth_month: "{{runtime_userBMonth}}"
    birth_year: "{{runtime_userBYear}}"
    firstname: "{{runtime_userFirst}}"
    lastname: "{{runtime_userLast}}"
    company: "{{runtime_userCompany}}"
    address1: "{{runtime_userAdd1}}"
    address2: "{{runtime_userAdd2}}"
    country: "{{runtime_userCountry}}"
    zipcode: "{{runtime_userZip}}"
    state: "{{runtime_userState}}"
    city: "{{runtime_userCity}}"
    mobile_number: "{{runtime_userMobile}}"
scripts:
  - type: beforeRequest
    code: "pm.environment.set(\"runtime_expectedStatusCode\",200);\r

      pm.environment.set(\"runtime_expectedResponseCode\",400);\r

      pm.environment.set(\"runtime_expectedMessageKeyword\", \"invalid\");"
    language: text/javascript
order: 1000
