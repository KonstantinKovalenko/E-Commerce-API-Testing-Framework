$kind: http-request
name: "400: Update account using invalid data"
url: "{{cfg_baseUrl}}/updateAccount"
method: PUT
body:
  type: urlencoded
  content:
    - key: name
      value: "{{runtime_userName}}"
      disabled: true
    - key: email
      value: "{{runtime_userInvalidEmail}}"
      disabled: false
    - key: password
      value: "{{runtime_userPassword}}"
      disabled: false
    - key: title
      value: "{{runtime_userTitle}}"
      disabled: true
    - key: birth_date
      value: birthday
      disabled: false
    - key: birth_month
      value: "{{runtime_userBMonth}}"
      disabled: true
    - key: birth_year
      value: "{{runtime_userBYear}}"
      disabled: true
    - key: firstname
      value: <script>alert(1)</script>
      disabled: false
    - key: lastname
      value: "{{runtime_userLast}}"
      disabled: true
    - key: company
      value: "\"/*'"
      disabled: false
    - key: address1
      value: "{{runtime_userAdd1}}"
      disabled: true
    - key: address2
      value: "' OR 1=1 --"
      disabled: false
    - key: country
      value: "{{runtime_userCountry}}"
      disabled: true
    - key: zipcode
      value: '"test"'
      disabled: false
    - key: state
      value: "{{runtime_userState}}"
      disabled: true
    - key: city
      value: "{{runtime_userCity}}"
      disabled: true
    - key: mobile_number
      value: "{{runtime_userMobile}}"
      disabled: true
scripts:
  - type: afterResponse
    code: "pm.test(\"API should reject invalid input\", () => {\r

      \    pm.expect(pm.response.code).to.be.oneOf([400, 422]);\r

      });\r

      \r

      pm.test(\"Server should handle special characters safely\", () => {\r

      \    pm.expect(pm.response.code).to.not.eql(500);\r

      });"
    language: text/javascript
order: 2000
