$kind: http-request
name: "404: Verify Login with invalid credentials"
url: "{{baseUrl}}/verifyLogin"
method: POST
body:
  type: urlencoded
  content:
    email: "{{userInvalidEmail}}"
    password: "{{userPassword}}"
scripts:
  - type: afterResponse
    code: "eval(pm.globals.get(\"utils\"));\r

      const jsonResponse = pm.response.json()\r

      \r

      validateStatusCode(200);\r

      validateJsonValue(Object.keys(jsonResponse)[0], jsonResponse.responseCode, 404)\r

      validateJsonValue(Object.keys(jsonResponse)[1], jsonResponse.message, \"User not found!\")"
    language: text/javascript
