$kind: http-request
name: "400: Create user account with invalid email"
url: "{{baseUrl}}/createAccount"
method: POST
body:
  type: urlencoded
  content:
    name: "{{userName}}"
    email: "{{userInvalidEmail}}"
    password: "{{userPassword}}"
    title: "{{userTitle}}"
    birth_date: "{{userBDay}}"
    birth_month: "{{userBMonth}}"
    birth_year: "{{userBYear}}"
    firstname: "{{userFirst}}"
    lastname: "{{userLast}}"
    company: "{{userCompany}}"
    address1: "{{userAdd1}}"
    address2: "{{userAdd2}}"
    country: "{{userCountry}}"
    zipcode: "{{userZip}}"
    state: "{{userState}}"
    city: "{{userCity}}"
    mobile_number: "{{userMobile}}"
scripts:
  - type: afterResponse
    code: "eval(pm.globals.get(\"utils\"));\r

      const jsonResponse = pm.response.json();\r

      \r

      validateStatusCode(400);\r

      validateJsonValue(Object.keys(jsonResponse)[0], jsonResponse.responseCode,
      400)\r

      \r

      pm.test(\"Invalid email should return validation error\", () => {\r

      \     pm.expect(jsonResponse.message).to.include(\"Invalid email\");\r

      });"
    language: text/javascript
order: 3000
