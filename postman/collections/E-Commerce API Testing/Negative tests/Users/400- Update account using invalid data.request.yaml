scripts:
  - type: afterResponse
    code: "pm.test(\"API should reject invalid input\", () => {\r

      \    pm.expect(pm.response.code).to.be.oneOf([400, 422]);\r

      });\r

      \r

      pm.test(\"Server should handle special characters safely\", () => {\r

      \    pm.expect(pm.response.code).to.not.eql(500);\r

      });"
