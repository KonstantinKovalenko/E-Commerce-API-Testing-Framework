$kind: http-request
name: "400: Create user account with missing parameters"
url: "{{cfg_baseUrl}}/createAccount"
method: POST
body:
  type: urlencoded
  content:
    - key: name
      value: "{{runtime_userName}}"
      disabled: false
    - key: email
      value: "{{runtime_userEmail}}"
      disabled: true
    - key: password
      value: "{{runtime_userPassword}}"
      disabled: false
    - key: title
      value: "{{runtime_userTitle}}"
      disabled: false
    - key: birth_date
      value: "{{runtime_userBDay}}"
      disabled: false
scripts:
  - type: beforeRequest
    code: "pm.environment.set(\"runtime_expectedStatusCode\",200);\r

      pm.environment.set(\"runtime_expectedResponseCode\",400);\r

      pm.environment.set(\"runtime_expectedMessageKeyword\", \"missing\");"
    language: text/javascript
order: 902
