$kind: http-request
name: "200: Delete user account"
url: "{{baseUrl}}/deleteAccount"
method: DELETE
body:
  type: urlencoded
  content:
    email: "{{userEmail}}"
    password: "{{userPassword}}"
scripts:
  - type: afterResponse
    code: "eval(pm.globals.get(\"utils\"));\r

      const jsonResponse = pm.response.json()\r

      \r

      validateStatusCode(200);\r

      validateJsonValue(Object.keys(jsonResponse)[0], jsonResponse.responseCode, 200)\r

      validateJsonValue(Object.keys(jsonResponse)[1], jsonResponse.message, \"Account deleted!\")\r

      \r\n"
    language: text/javascript
order: 3000
