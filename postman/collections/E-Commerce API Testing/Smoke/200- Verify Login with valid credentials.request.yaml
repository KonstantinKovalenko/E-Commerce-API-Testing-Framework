$kind: http-request
name: "200: Verify Login with valid credentials"
url: "{{cfg_baseUrl}}/verifyLogin"
method: POST
body:
  type: urlencoded
  content:
    email: "{{runtime_userEmail}}"
    password: "{{runtime_userPassword}}"
scripts:
  - type: beforeRequest
    code: "pm.environment.set(\"runtime_expectedStatusCode\",200);\r

      pm.environment.set(\"runtime_expectedResponseCode\",200);\r

      pm.environment.set(\"runtime_expectedMessageKeyword\", \"exists\");"
    language: text/javascript
order: 2000
