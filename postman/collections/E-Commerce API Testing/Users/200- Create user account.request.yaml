$kind: http-request
name: "200: Create user account"
url: "{{baseUrl}}/createAccount"
method: POST
body:
  type: urlencoded
  content:
    name: "{{userName}}"
    email: "{{userEmail}}"
    password: "{{userPassword}}"
    title: "{{userTitle}}"
    birth_date: "{{userBDay}}"
    birth_month: "{{userBMonth}}"
    birth_year: "{{userBYear}}"
    firstname: "{{userFirst}}"
    lastname: "{{userLast}}"
    company: "{{userCompany}}"
    address1: "{{userAdd1}}"
    address2: "{{userAdd2}}"
    country: "{{userCountry}}"
    zipcode: "{{userZip}}"
    state: "{{userState}}"
    city: "{{userCity}}"
    mobile_number: "{{userMobile}}"
scripts:
  - type: afterResponse
    code: "const jsonResponse = pm.response.json()\r

      \r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"responseCode validation\", function () {\r

      \    pm.expect(jsonResponse.responseCode).to.eql(201);\r

      });\r

      \r

      pm.test(\"message validation\", function () {\r

      \    pm.expect(jsonResponse.message).to.eql(\"User created!\");\r

      });"
    language: text/javascript
  - type: beforeRequest
    code: "const currentRandom = pm.environment.get(\"currentRandom\")\r

      \r

      pm.environment.set(\"userTitle\", `title_${currentRandom}`);\r

      pm.environment.set(\"userBDay\", \"20\");\r

      pm.environment.set(\"userBMonth\", \"10\");\r

      pm.environment.set(\"userBYear\", \"2000\");\r

      pm.environment.set(\"userFirst\", `first_${currentRandom}`);\r

      pm.environment.set(\"userLast\", `last_${currentRandom}`);\r

      pm.environment.set(\"userCompany\", `company_${currentRandom}`);\r

      pm.environment.set(\"userAdd1\", `address1_${currentRandom}`);\r

      pm.environment.set(\"userAdd2\", `address2_${currentRandom}`);\r

      pm.environment.set(\"userCountry\", `country_${currentRandom}`);\r

      pm.environment.set(\"userState\", `state_${currentRandom}`);\r

      pm.environment.set(\"userCity\", `city_${currentRandom}`);\r

      pm.environment.set(\"userZip\", `zip_${currentRandom}`);\r

      pm.environment.set(\"userMobile\", `mob_${currentRandom}`);"
    language: text/javascript
order: 1778670121172
